sudo: required
services:
  - docker

before_install: 
  - docker build -t 4klud/react-test -f ./client/Dockerfile.dev ./client

script: 
  - docker run 4klud/react-test npm test -- --coverage

after_success: 
  - docker build -t 4klud/multi-client ./client
  - docker build -t 4klud/multi-nginx ./nginx
  - docker build -t 4klud/multi-server ./server
  - docker build -t 4klud/multi-worker ./worker

  # Log in to Docker CLI
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_ID" --password-stdin

  # Take those images and push them to Docker Hub
  - docker push 4klud/multi-client
  - docker push 4klud/multi-nginx
  - docker push 4klud/multi-server
  - docker push 4klud/multi-worker