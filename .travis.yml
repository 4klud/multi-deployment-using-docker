language: generic
sudo: required
services:
  - docker

before_install: 
  - docker build -t docker4klud/react-test -f ./client/Dockerfile.dev ./client

script: 
  - docker run -e CI=true docker4klud/react-test npm test -- --coverage

after_success: 
  - docker build -t docker4klud/multi-client ./client
  - docker build -t docker4klud/multi-nginx ./nginx
  - docker build -t docker4klud/multi-server ./server
  - docker build -t docker4klud/multi-worker ./worker

  # Log in to Docker CLI
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_ID" --password-stdin

  # Take those images and push them to Docker Hub
  - docker push docker4klud/multi-client
  - docker push docker4klud/multi-nginx
  - docker push docker4klud/multi-server
  - docker push docker4klud/multi-worker

deploy:
  provider: elasticbeanstalk
  region: "us-west-2" 
  app: "multi-docker"
  env: "Multi-docker-env"
  bucket_name: "elasticbeanstalk-us-west-2-625980020286"
  bucket_path: "multi-docker"
  on:
    branch: main
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: $AWS_SECRET_KEY  
  